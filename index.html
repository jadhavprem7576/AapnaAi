    <script>
      (function () {
        try {
          if (window.self !== window.top) {
            // Inside AI Studio development preview iframe: clean up SW to prevent caching stale previews
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (var i = 0; i < registrations.length; i++) {
                  registrations[i].unregister();
                }
              }).catch(function () {});
            }
          } else {
            // Top-level standalone browser (e.g. Android phone or direct tab):
            // Register Service Worker for PWA / WebAPK phone installability
            if ('serviceWorker' in navigator) {
              window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function () {});
              });
            }
          }
        } catch (e) {}
      })();
    </script>
